 <details class="card compact-details"><summary><b>Resumen mensual</b><span class="muted small">ver</span></summary><div class="summary-grid"><div><span class="muted small">Ingresos reales</span><b>${money(ms.income)}</b></div><div><span class="muted small">Salidas registradas</span><b>${money(ms.out)}</b></div><div><span class="muted small">Gastos de vida</span><b>${money(ms.living)}</b></div><div><span class="muted small">Neto registrado</span><b>${money(ms.net)}</b></div><div><span class="muted small">Ahorro protegido</span><b>${money(cushion?.current_amount)}</b></div><div><span class="muted small">Deuda reportada</span><b>${money(c.debt)}</b></div></div><p class="muted small">La quincena cambia automáticamente el día 16 y el día 1. El historial anterior permanece guardado.</p></details>
 </main><main class="app-page" data-page="bills"><div class="page-head"><h2>Bills</h2><span class="muted">Semáforo y pagos</span></div><div class="card">${bills}</div>
 </main><main class="app-page" data-page="more"><div class="page-head"><h2>Más</h2><span class="muted">Deuda, ahorro y familia</span></div><div class="sectiontitle">Tarjetas · solo deuda</div><div class="card"><div class="muted">Deuda reportada</div><div class="debt">${money(c.debt)}</div>${cards}<p class="muted small">El crédito disponible nunca se cuenta como dinero para gastar. Un pago no cambia el balance reportado hasta que tú lo actualices.</p></div>
 <div class="sectiontitle">Ahorro protegido</div><div class="card"><div class="row"><span>${esc(cushion?.name||"Colchón inicial")}</span><strong>${money(cushion?.current_amount)} / ${money(cushion?.target_amount)}</strong></div><div class="bar"><i style="width:${pct}%"></i></div></div>
 ${familyOwnerHtml()}<div class="muted small" style="text-align:center;padding:22px 0">Mi Flow V10.9 · disponible real</div></main><div id="modal"></div><nav class="bottom-nav"><button data-page="home" class="active" onclick="switchPage('home')"><span>⌂</span>Inicio</button><button data-page="bills" onclick="switchPage('bills')"><span>▣</span>Bills</button><button onclick="expenseForm()"><span>＋</span>Gasto</button><button data-page="history" onclick="switchPage('history')"><span>↶</span>Historial</button><button data-page="more" onclick="switchPage('more')"><span>•••</span>Más</button></nav></div>`;
 setTimeout(()=>switchPage(activePage),0);
}
function memberName(uid){const m=(data.members||[]).find(x=>x.user_id===uid);return m?.display_name||"Miembro"}
function familyOwnerHtml(){if(!data.household)return "";const entries=data.familyEntries||[],inc=entries.filter(x=>x.direction==="income").reduce((a,x)=>a+num(x.amount),0),out=entries.filter(x=>x.direction==="expense").reduce((a,x)=>a+num(x.amount),0),members=(data.members||[]).map(m=>`<div class="row"><span>${esc(m.display_name||"Miembro")}</span><span class="muted small">${esc(m.role)}</span></div>`).join("");return `<div class="sectiontitle">Mi Familia</div><div class="card"><div class="row"><div><b>${esc(data.household.household_name||"Mi Familia")}</b><div class="muted small">${(data.members||[]).length} miembro(s)</div></div><button class="btn secondary" onclick="inviteForm()">+ Añadir usuario</button></div>${members}<hr><div class="grid"><div class="mini"><span class="muted">Ingresos de miembros</span><b>${money(inc)}</b></div><div class="mini"><span class="muted">Gastos de miembros</span><b>${money(out)}</b></div></div>${entries.slice(0,8).map(e=>`<div class="row"><span>${esc(memberName(e.user_id))} · ${esc(e.description||e.category_name||e.direction)}</span><b>${e.direction==="income"?"+":"−"}${money(e.amount)}</b></div>`).join("")||`<p class="muted small">Todavía no hay movimientos de otros miembros.</p>`}</div>`}
function inviteForm(){$("#modal").innerHTML=`<div class="card"><h2>Añadir a Mi Familia</h2><label>Email</label><input id="invemail" type="email" placeholder="persona@email.com"><label>Permiso</label><select id="invrole"><option value="member">Miembro</option><option value="admin">Admin</option></select><p class="muted small">La persona crea su cuenta con ese mismo email y, al entrar, la invitación se acepta automáticamente.</p><div class="actions"><button class="btn" onclick="sendInvite()">Crear invitación</button><button class="btn secondary" onclick="render()">Cancelar</button></div></div>`}
async function sendInvite(){try{const email=$("#invemail").value.trim();if(!email)return alert("Escribe el email.");await rpc("invite_household_member",{invite_email:email,invite_role:$("#invrole").value});alert("Invitación preparada. Que cree/entre con ese mismo email en Mi Flow.");await load();render()}catch(e){alert(e.message)}}
function renderMember(){const entries=data.familyEntries||[],mine=entries.filter(x=>x.user_id===user.id),inc=entries.filter(x=>x.direction==="income").reduce((a,x)=>a+num(x.amount),0),out=entries.filter(x=>x.direction==="expense").reduce((a,x)=>a+num(x.amount),0);$("#app").innerHTML=`<div class="wrap"><div class="top"><div><div class="brand">Mi Flow</div><div class="muted small">${esc(data.household.household_name||"Mi Familia")} · ${esc(data.household.display_name||"Miembro")}</div></div><button class="btn secondary" onclick="logout()">Salir</button></div><div class="card hero"><div class="eyebrow">BALANCE FAMILIAR REGISTRADO POR MIEMBROS</div><div class="money">${money(inc-out)}</div><div class="muted">Ingresos ${money(inc)} · Gastos ${money(out)}</div></div><div class="actions"><button class="btn" onclick="familyEntryForm('income')">+ Ingreso</button><button class="btn secondary" onclick="familyEntryForm('expense')">+ Gasto</button></div><div class="sectiontitle">Mis movimientos</div><div class="card">${mine.map(e=>`<div class="row"><span>${esc(e.description||e.category_name||e.direction)}<div class="muted small">${e.occurred_on}</div></span><b>${e.direction==="income"?"+":"−"}${money(e.amount)}</b></div>`).join("")||`<p class="muted">No has registrado movimientos todavía.</p>`}</div><div class="muted small" style="text-align:center;padding:22px 0">Mi Flow V10.6 · miembro familiar</div><div id="modal"></div></div>`}
function familyEntryForm(dir){$("#modal").innerHTML=`<div class="card"><h2>${dir==="income"?"Registrar ingreso":"Registrar gasto"}</h2><label>Cantidad</label><input id="famt" type="number" step=".01"><label>${dir==="income"?"Descripción":"Categoría"}</label><input id="fcat" placeholder="${dir==="income"?"Quincena / ingreso extra":"Compra / Gas / Familia / Otro"}"><label>Nota <span class="muted">(opcional)</span></label><input id="fdesc"><div class="actions"><button class="btn" onclick="saveFamilyEntry('${dir}')">Guardar</button><button class="btn secondary" onclick="render()">Cancelar</button></div></div>`}
async function saveFamilyEntry(dir){try{const amount=num($("#famt").value);if(!(amount>0))return alert("Entra una cantidad válida.");const x=$("#fcat").value|| (dir==="income"?"Ingreso":"Otro");await rpc("add_household_entry",{entry_amount:amount,entry_direction:dir,entry_description:$("#fdesc").value||x,entry_category:dir==="expense"?x:null,entry_date:today()});await load();render()}catch(e){alert(e.message)}}
async function insert(table,obj){return api("/rest/v1/"+table,{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(obj)})}
async function update(table,id,obj){return api(`/rest/v1/${table}?id=eq.${id}`,{method:"PATCH",headers:{Prefer:"return=representation"},body:JSON.stringify(obj)})}
function incomeForm(){$("#modal").innerHTML=`<div class="card"><h2>Registrar ingreso</h2><p class="muted small">Registra lo que realmente entró. Si es dinero adicional, descríbelo como ingreso extra.</p><label>Cantidad realmente recibida</label><input id="amt" type="number" step=".01"><label>Descripción</label><input id="desc" placeholder="Quincena / ingreso extra"><div class="actions"><button class="btn" onclick="saveIncome()">Guardar</button><button class="btn secondary" onclick="render()">Cancelar</button></div></div>`;$("#modal").scrollIntoView({behavior:"smooth"})}
async function saveIncome(){try{let a=num($("#amt").value);if(!(a>0))return alert("Entra una cantidad válida.");await insert("transactions",{user_id:user.id,amount:a,direction:"income",description:$("#desc").value||"Ingreso recibido",occurred_on:today()});await load();render()}catch(e){showError(e)}}
function expenseForm(){let opts=data.cats.filter(c=>["living","unexpected"].includes(c.kind)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");$("#modal").innerHTML=`<div class="card"><h2>Registrar gasto</h2><label>Cantidad</label><input id="amt" type="number" step=".01"><label>Categoría</label><select id="cat">${opts}</select><label>Descripción</label><input id="desc"><div class="actions"><button class="btn" onclick="saveExpense()">Guardar</button><button class="btn secondary" onclick="render()">Cancelar</button></div></div>`;$("#modal").scrollIntoView({behavior:"smooth"})}
async function saveExpense(){try{let a=num($("#amt").value);if(!(a>0))return alert("Entra una cantidad válida.");await insert("transactions",{user_id:user.id,amount:a,direction:"expense",category_id:$("#cat").value,description:$("#desc").value||"Gasto",occurred_on:today()});await load();render()}catch(e){showError(e)}}
function payBillForm(id){const b=data.bills.find(x=>x.id===id),s=calc().status[id];$("#modal").innerHTML=`<div class="card"><h2>Pagar ${esc(b.name)}</h2><p class="muted">Compromiso de esta quincena: ${money(s.target)} · ya registrado: ${money(s.paid)}</p><label>Cantidad pagada ahora</label><input id="payamt" type="number" step=".01" value="${s.remaining.toFixed(2)}"><div class="actions"><button class="btn" onclick="saveBillPayment('${id}')">Registrar pago</button><button class="btn secondary" onclick="render()">Cancelar</button></div></div>`;$("#modal").scrollIntoView({behavior:"smooth"})}
async function saveBillPayment(id){try{let amount=num($("#payamt").value);if(!(amount>0))return alert("Entra una cantidad válida.");await rpc("record_bill_payment_atomic",{p_bill_id:id,p_amount:amount,p_paid_on:today(),p_billing_month:data.p.monthStart});await load();render()}catch(e){showError(e)}}
function editCard(id){let card=data.cards.find(x=>x.id===id),snap=data.snaps.find(x=>x.account_id===id);$("#modal").innerHTML=`<div class="card"><h2>${esc(card.name)}</h2><label>Balance reportado</label><input id="bal" type="number" step=".01" value="${card.current_balance}"><label>Pago mínimo</label><input id="min" type="number" step=".01" value="${snap?.minimum_due||0}"><label>Día de vencimiento</label><input id="due" type="number" min="1" max="31" value="${snap?.due_day||1}"><div class="actions"><button class="btn" onclick="saveCard('${id}')">Guardar</button><button class="btn secondary" onclick="render()">Cancelar</button></div></div>`;$("#modal").scrollIntoView({behavior:"smooth"})}
async function saveCard(id){try{let bal=num($("#bal").value),min=num($("#min").value),due=num($("#due").value);if(bal<0||min<0||due<1||due>31)return alert("Revisa los valores.");await update("accounts",id,{current_balance:bal});await insert("card_snapshots",{user_id:user.id,account_id:id,balance:bal,minimum_due:min,due_day:due,reported_at:new Date().toISOString()});let bill=data.bills.find(b=>b.account_id===id);if(bill)await update("bills",bill.id,{amount:min,due_day:due});await load();render()}catch(e){showError(e)}}
function editBill(id){let b=data.bills.find(x=>x.id===id);$("#modal").innerHTML=`<div class="card"><h2>Editar ${esc(b.name)}</h2><label>Monto mensual</label><input id="bamt" type="number" step=".01" value="${b.amount}"><label>Día de vencimiento</label><input id="bdue" type="number" min="1" max="31" value="${b.due_day||1}"><div class="actions"><button class="btn" onclick="saveBill('${id}')">Guardar</button><button class="btn secondary" onclick="render()">Cancelar</button></div></div>`;$("#modal").scrollIntoView({behavior:"smooth"})}
async function saveBill(id){try{let amount=num($("#bamt").value),due=num($("#bdue").value);if(amount<0||due<1||due>31)return alert("Revisa los valores.");await update("bills",id,{amount,due_day:due});await load();render()}catch(e){showError(e)}}
function settingsForm(){let cats=data.cats.filter(c=>c.kind==="living").map(c=>`<label>${esc(c.name)} — mensual</label><input class="catset" data-id="${c.id}" type="number" step=".01" value="${c.monthly_budget}">`).join(""),sg=data.savings[0];$("#modal").innerHTML=`<div class="card"><h2>Ajustes</h2><label>Ingreso mensual esperado</label><input id="monthly" type="number" step=".01" value="${data.profile.monthly_income}"><label>Quincena esperada</label><input id="paycheck" type="number" step=".01" value="${data.profile.paycheck_amount}">${cats}<label>Meta del colchón</label><input id="goal" type="number" step=".01" value="${sg?.target_amount||2000}"><label>Ahorro actual protegido</label><input id="saved" type="number" step=".01" value="${sg?.current_amount||0}"><div class="actions"><button class="btn" onclick="saveSettings()">Guardar</button><button class="btn secondary" onclick="render()">Cancelar</button></div></div>`;$("#modal").scrollIntoView({behavior:"smooth"})}
async function saveSettings(){try{let monthly=num($("#monthly").value),paycheck=num($("#paycheck").value),goal=num($("#goal").value),saved=num($("#saved").value);await api(`/rest/v1/profiles?user_id=eq.${user.id}`,{method:"PATCH",body:JSON.stringify({monthly_income:monthly,paycheck_amount:paycheck,savings_goal:goal,updated_at:new Date().toISOString()})});for(const el of document.querySelectorAll(".catset"))await update("categories",el.dataset.id,{monthly_budget:num(el.value)});if(data.savings[0])await update("savings_goals",data.savings[0].id,{target_amount:goal,current_amount:saved});await load();render()}catch(e){showError(e)}}
const bootTimer=setTimeout(()=>{if($("#app")?.textContent?.includes("Cargando"))showError(new Error("El arranque no terminó. Pulsa Reintentar."))},15000);
init().finally(()=>clearTimeout(bootTimer));
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));}</script></body></html>
